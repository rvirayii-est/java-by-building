name: CI

on:
  push:
    branches: [main]
  pull_request:

# The least a build needs: read the repository. (A leaked workflow cannot then change your code.)
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going: nobody waits for an old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Every lesson README has its front matter and its eight sections
        run: java scripts/LessonTool.java check
      - name: lessons/index.json is up to date
        run: java scripts/LessonTool.java index --check
      - name: Reference solutions build and tests pass
        run: ./mvnw -B verify
      - name: Starters and exercises compile (their tests are expected to fail)
        run: ./mvnw -B -Pstudent test-compile
      - name: Every lesson example runs
        run: bash scripts/run-examples.sh
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports"
          retention-days: 7
