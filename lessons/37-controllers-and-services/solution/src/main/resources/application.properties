# Spring Boot reads this file at start-up. Every line is "setting=value". Delete a line to get Spring's default.
spring.application.name=shop-api

# The web server's port (8080 is the default; written here so you can see where to change it).
server.port=8080

# Show the message of an error in the JSON answer of Spring's error page (hidden by default).
server.error.include-message=always

# Spring Boot's JSON reader ignores fields it does not know. Lesson 35's reader refused them, so a typo such as "reorderLvl"
# got a 400. Keep that strictness.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Our own settings (read in ShopConfig):
#   shop.database.mode = file (a database in shop.data-dir, kept between runs) or memory (gone when the app stops)
#   shop.data-dir      = the folder for the database file
#   shop.seed-sample   = fill an EMPTY database with the four sample products
shop.database.mode=file
shop.data-dir=shop-data
shop.seed-sample=true
