# Docker Compose: describe the containers once, start them with one command.
#     docker compose -f lessons/45-docker/solution/compose.yaml up --build
# Stop with Ctrl+C (or "docker compose ... down"). "down -v" ALSO deletes the data volume.
name: shop

services:
  shop-api:
    build:
      context: ../../..                                   # the repository root: the parent pom.xml is there
      dockerfile: lessons/45-docker/solution/Dockerfile
    image: java-by-building/shop-api:45
    ports:
      - "8080:8080"                                       # your PC's port 8080 -> the container's port 8080
    environment:
      SHOP_DATA_DIR: /data
      # Settings come from the environment. ${NAME:-default} means: use the variable NAME if it is set, otherwise the default.
      # The defaults are the learning passwords; lesson 46 removes them.
      SHOP_SECURITY_ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD:-admin123}
      SHOP_SECURITY_CASHIER_PASSWORD: ${SHOP_CASHIER_PASSWORD:-cashier123}
    volumes:
      - shop-data:/data                                   # a named volume: survives "docker compose down"
    restart: unless-stopped

volumes:
  shop-data:
