# Spring Boot reads this file at start-up. Every line is "setting=value". Delete a line to get Spring's default.
spring.application.name=shop-api
server.port=${PORT:8080}
server.error.include-message=always
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Lesson 38: the database -------------------------------------------------------------------------------------
# Our own settings:
#   shop.data-dir    = the folder for the database file (shop.mv.db). H2 wants a relative path to start with ./ (or give a full path)
#   shop.seed-sample = fill an EMPTY database with the four sample products
shop.data-dir=./shop-data
shop.seed-sample=true

# The DataSource: where the database is. Spring Boot builds a connection pool (HikariCP) from these. Tests give another URL.
# jdbc:h2:file:  = a database in files (kept between runs);  jdbc:h2:mem:name;DB_CLOSE_DELAY=-1  = memory only.
spring.datasource.url=jdbc:h2:file:${shop.data-dir}/shop

# Flyway runs the files in src/main/resources/db/migration (V1, V2, V3 ...) before anything else uses the database.
# (Spring Boot does this by itself when flyway-core is on the class path; nothing is needed here.)

# JPA / Hibernate:
#   ddl-auto=validate : at start-up, CHECK that every entity matches the tables Flyway made, and refuse to start if not.
#                       (The other values - create, update - let Hibernate change your tables. Never do that: migrations own the design.)
#   open-in-view=false: do not keep a database session open while the JSON is being written (a habit that hides slow code).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Lesson 41: the demo users ----------------------------------------------------------------------------------
# Passwords of the two users created in an EMPTY app_user table (stored hashed). These defaults are for learning on your own PC.
# They are read into SecuritySettings, which refuses a missing or too short password. The "prod" profile has no defaults at all (lesson 46).
# A real installation sets its own (lesson 46: environment variables).
shop.security.admin-password=admin123
shop.security.cashier-password=cashier123

# --- Lesson 45: running in a container ---------------------------------------------------------------------------
# "docker stop" sends a stop signal and, after a grace period, kills the process. A graceful shutdown stops taking NEW requests and
# lets the ones in progress finish (a sale being written must not be cut in half), for at most 20 seconds.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Lesson 47: monitoring ------------------------------------------------------------------------------------------
# Actuator publishes endpoints under /actuator. EXPOSE ONLY WHAT YOU NEED: the default is just "health", and "env" or "heapdump"
# would hand an attacker your settings or your memory. SecurityConfig decides WHO may call each one.
# TODO 3: expose ONLY what is needed:  management.endpoints.web.exposure.include=health,info,metrics   ("*" exposes env, beans, heapdump ...: never in production)
management.endpoints.web.exposure.include=*
# /actuator/health/liveness ("is the process alive?") and /actuator/health/readiness ("can it take requests now?") for platforms.
management.endpoint.health.probes.enabled=true
# Ready = the database answers too (the sample data is loaded before readiness turns UP).
management.endpoint.health.group.readiness.include=readinessState,db
# A stranger sees only {"status":"UP"}. The parts (database, disk space ...) are shown to an ADMIN only.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# What /actuator/info shows (anything under info.* in this file).
management.info.env.enabled=true
info.app.name=Inventory & Sales API
info.app.description=The Java by Building course project
info.app.lesson=47
# Every log line carries the id of the request that caused it (RequestIdFilter puts it in the MDC); [-] when there is none.
logging.pattern.level=%5p [%X{requestId:-}]
