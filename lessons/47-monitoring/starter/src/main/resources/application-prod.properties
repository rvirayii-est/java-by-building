# Read ON TOP of application.properties when the "prod" profile is active:  SPRING_PROFILES_ACTIVE=prod  (or --spring.profiles.active=prod).
# Rule of this file: NOTHING secret has a default. ${NAME} (without a default) must exist in the environment, or the app refuses to start.
# Order of strength, weakest first: application.properties < this file < environment variables < command-line arguments.

# The two demo users. They are created in an EMPTY database the first time; changing the variable later does not change a stored password.
shop.security.admin-password=${SHOP_ADMIN_PASSWORD}
shop.security.cashier-password=${SHOP_CASHIER_PASSWORD}
shop.security.min-password-length=12

# Where the database file is, and whether to fill an empty database with sample products.
shop.data-dir=${SHOP_DATA_DIR:/data}
shop.seed-sample=${SHOP_SEED_SAMPLE:false}

# Many hosting services tell the app which port to use in the variable PORT.
server.port=${PORT:8080}

# A server in the open does not need to explain itself to strangers: no messages in Spring's own error page,
# and the Swagger page (not the API description) is off unless asked for.
server.error.include-message=never
springdoc.swagger-ui.enabled=${SHOP_SWAGGER_ENABLED:false}

# Lesson 47: one JSON object per log line (timestamp, level, message, the MDC with requestId, stack traces as one field).
# Log collectors (Loki, Elastic, CloudWatch ...) can search and filter such lines; plain text must be parsed with guesswork.
logging.structured.format.console=logstash
