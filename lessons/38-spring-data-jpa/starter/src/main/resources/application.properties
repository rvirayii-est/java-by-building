# Spring Boot reads this file at start-up. Every line is "setting=value". Delete a line to get Spring's default.
spring.application.name=shop-api
server.port=8080
server.error.include-message=always
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Lesson 38: the database -------------------------------------------------------------------------------------
# Our own settings:
#   shop.data-dir    = the folder for the database file (shop.mv.db). H2 wants a relative path to start with ./ (or give a full path)
#   shop.seed-sample = fill an EMPTY database with the four sample products
shop.data-dir=./shop-data
shop.seed-sample=true

# The DataSource: where the database is. Spring Boot builds a connection pool (HikariCP) from these. Tests give another URL.
# jdbc:h2:file:  = a database in files (kept between runs);  jdbc:h2:mem:name;DB_CLOSE_DELAY=-1  = memory only.
# TODO 5: the line   spring.datasource.url=jdbc:h2:file:${shop.data-dir}/shop   (the database file lives in the folder shop.data-dir)

# Flyway runs the files in src/main/resources/db/migration (V1, V2, V3 ...) before anything else uses the database.
# (Spring Boot does this by itself when flyway-core is on the class path; nothing is needed here.)

# JPA / Hibernate:
#   ddl-auto=validate : at start-up, CHECK that every entity matches the tables Flyway made, and refuse to start if not.
#                       (The other values - create, update - let Hibernate change your tables. Never do that: migrations own the design.)
#   open-in-view=false: do not keep a database session open while the JSON is being written (a habit that hides slow code).
# TODO 5 (continued): spring.jpa.hibernate.ddl-auto=validate
# TODO 5 (continued): spring.jpa.open-in-view=false
